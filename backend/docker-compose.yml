services:
  postgres:
    image: postgres:16
    container_name: amber-postgres
    environment:
      POSTGRES_DB: amber_monitor
      POSTGRES_USER: amber
      POSTGRES_PASSWORD: amber
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amber-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic

volumes:
  postgres_data:
